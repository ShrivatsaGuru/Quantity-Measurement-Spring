# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=quantity-measurement
server.port=8080

# ── H2 In-Memory Database ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://172.31.34.235:3306/quantitydb?createDatabaseIfNotExist=true
spring.datasource.username=quantityadmin
spring.datasource.password=quantity@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: schema is created on startup, dropped on shutdown (dev only)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.app.quantitymeasurement=DEBUG
logging.level.org.springframework.security=WARN
